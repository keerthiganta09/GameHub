<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameHub - Rock Paper Scissors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        nav {
            background: #111827;
            padding: 20px;
        }

        nav a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 18px;
        }

        h1 {
            margin-top: 35px;
            font-size: 38px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .container {
            width: 700px;
            max-width: 92%;
            margin: 30px auto;
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
        }

        .mode-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #38bdf8;
            color: #0f172a;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .secondary-btn {
            background: #334155;
            color: white;
            border: 1px solid #38bdf8;
        }

        .section {
            display: none;
            margin-top: 25px;
        }

        input {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            margin: 8px 0;
        }

        .game-section {
            display: none;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .score-box {
            min-width: 180px;
            background: #334155;
            padding: 15px 25px;
            border-radius: 12px;
        }

        .score-box h3 {
            margin: 0;
            font-size: 18px;
        }

        .score-box span {
            display: block;
            font-size: 32px;
            color: #38bdf8;
            margin-top: 8px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .choice {
            width: 120px;
            height: 120px;
            font-size: 55px;
            background: #334155;
            color: white;
            border: 2px solid #38bdf8;
        }

        .result {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            min-height: 80px;
            font-size: 20px;
            margin-top: 20px;
        }

        .room-code {
            color: #38bdf8;
            font-size: 26px;
            font-weight: bold;
        }

        #back-to-menu {
            margin-top: 20px;
            background: #64748b;
            color: white;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .choice {
                width: 90px;
                height: 90px;
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">⬅ Back to GameHub</a>
    </nav>

    <h1>✊ Rock Paper Scissors ✋</h1>

    <p class="subtitle">
        Play with Computer or challenge your friend anywhere! 🌍
    </p>


    <!-- MAIN MENU -->

    <div class="container" id="main-menu">

        <h2>Choose Game Mode 🎮</h2>

        <div class="mode-buttons">

            <button onclick="playWithComputer()">
                🤖 Play with Computer
            </button>

            <button onclick="showCreateRoom()">
                🏠 Create Room
            </button>

            <button onclick="showJoinRoom()">
                🔑 Join Room
            </button>

        </div>


        <!-- CREATE ROOM -->

        <div class="section" id="create-room-section">

            <h2>Create Multiplayer Room 🏠</h2>

            <input
                type="text"
                id="create-player-name"
                placeholder="Enter your name"
            >

            <br>

            <button onclick="createRoom()">
                Create Room
            </button>

            <div id="created-room-message"></div>

        </div>


        <!-- JOIN ROOM -->

        <div class="section" id="join-room-section">

            <h2>Join Friend's Room 🔑</h2>

            <input
                type="text"
                id="join-player-name"
                placeholder="Enter your name"
            >

            <br>

            <input
                type="text"
                id="join-room-code"
                placeholder="Enter Room Code"
            >

            <br>

            <button onclick="joinRoom()">
                Join Game
            </button>

        </div>

    </div>


    <!-- GAME SECTION -->

    <div class="container game-section" id="game-section">

        <h2 id="game-title">Game</h2>

        <div class="score-board">

            <div class="score-box">
                <h3 id="player-name-display">You</h3>
                <span id="player-score">0</span>
            </div>

            <div class="score-box">
                <h3 id="opponent-name-display">Computer</h3>
                <span id="opponent-score">0</span>
            </div>

        </div>

        <h2>Choose Your Move</h2>

        <div class="choices">

            <button class="choice" onclick="makeMove('rock')">
                ✊
            </button>

            <button class="choice" onclick="makeMove('paper')">
                ✋
            </button>

            <button class="choice" onclick="makeMove('scissors')">
                ✌️
            </button>

        </div>

        <div class="result" id="result">
            Choose your move! 🎮
        </div>

        <button id="back-to-menu" onclick="backToMenu()">
            ⬅ Back to Menu
        </button>

    </div>


    <!-- SOCKET.IO -->

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>

        /*
        IMPORTANT:

        Temporary backend URL.
        Later localhost:3000 ni deployed backend URL tho replace cheddam.
        */

        const socket = io("http://localhost:3000");

        let gameMode = "";
        let currentRoom = "";
        let playerName = "";

        let playerScore = 0;
        let opponentScore = 0;

        const emojis = {
            rock: "✊",
            paper: "✋",
            scissors: "✌️"
        };


        function hideAllSections() {

            document
                .getElementById("create-room-section")
                .style.display = "none";

            document
                .getElementById("join-room-section")
                .style.display = "none";

        }


        function showCreateRoom() {

            hideAllSections();

            document
                .getElementById("create-room-section")
                .style.display = "block";

        }


        function showJoinRoom() {

            hideAllSections();

            document
                .getElementById("join-room-section")
                .style.display = "block";

        }


        /* PLAY WITH COMPUTER */

        function playWithComputer() {

            gameMode = "computer";

            playerScore = 0;
            opponentScore = 0;

            document
                .getElementById("main-menu")
                .style.display = "none";

            document
                .getElementById("game-section")
                .style.display = "block";

            document
                .getElementById("game-title")
                .innerText = "🤖 Playing with Computer";

            document
                .getElementById("player-name-display")
                .innerText = "You";

            document
                .getElementById("opponent-name-display")
                .innerText = "Computer";

            updateScores();

            document
                .getElementById("result")
                .innerText = "Choose your move! 🎮";

        }


        /* CREATE ROOM */

        function generateRoomCode() {

            return Math.random()
                .toString(36)
                .substring(2, 8)
                .toUpperCase();

        }


        function createRoom() {

            playerName = document
                .getElementById("create-player-name")
                .value
                .trim();

            if (!playerName) {

                alert("Please enter your name!");

                return;
            }

            currentRoom = generateRoomCode();

            socket.emit("createRoom", {
                roomCode: currentRoom,
                playerName: playerName
            });

        }


        socket.on("roomCreated", (data) => {

            gameMode = "multiplayer";

            document
                .getElementById("created-room-message")
                .innerHTML =
                "<br>Room Created! 🎉<br><br>" +
                "Share this code with your friend:<br><br>" +
                "<span class='room-code'>" +
                data.roomCode +
                "</span><br><br>" +
                "Waiting for your friend...";

        });


        /* JOIN ROOM */

        function joinRoom() {

            playerName = document
                .getElementById("join-player-name")
                .value
                .trim();

            currentRoom = document
                .getElementById("join-room-code")
                .value
                .trim()
                .toUpperCase();

            if (!playerName || !currentRoom) {

                alert("Please enter your name and room code!");

                return;
            }

            socket.emit("joinRoom", {
                roomCode: currentRoom,
                playerName: playerName
            });

        }


        /* MULTIPLAYER START */

        socket.on("gameStart", (data) => {

            gameMode = "multiplayer";

            playerScore = 0;
            opponentScore = 0;

            document
                .getElementById("main-menu")
                .style.display = "none";

            document
                .getElementById("game-section")
                .style.display = "block";


            document
                .getElementById("game-title")
                .innerText =
                "🌍 Multiplayer Room: " + currentRoom;


            const me = data.players.find(
                player => player.name === playerName
            );

            const opponent = data.players.find(
                player => player.name !== playerName
            );


            if (me && opponent) {

                document
                    .getElementById("player-name-display")
                    .innerText = me.name;

                document
                    .getElementById("opponent-name-display")
                    .innerText = opponent.name;

            }

            document
                .getElementById("result")
                .innerText =
                "Opponent connected! Choose your move 🎮";

        });


        /* MAKE MOVE */

        function makeMove(choice) {

            if (gameMode === "computer") {

                playComputerGame(choice);

            }

            else if (gameMode === "multiplayer") {

                socket.emit("playerChoice", {
                    roomCode: currentRoom,
                    choice: choice
                });

                document
                    .getElementById("result")
                    .innerText =
                    "Move selected! Waiting for opponent...";

            }

        }


        /* COMPUTER GAME LOGIC */

        function playComputerGame(playerChoice) {

            const choices = [
                "rock",
                "paper",
                "scissors"
            ];

            const computerChoice =
                choices[
                    Math.floor(
                        Math.random() * choices.length
                    )
                ];

            let resultText = "";


            if (playerChoice === computerChoice) {

                resultText = "It's a Draw! 🤝";

            }

            else if (

                (playerChoice === "rock" &&
                    computerChoice === "scissors")

                ||

                (playerChoice === "paper" &&
                    computerChoice === "rock")

                ||

                (playerChoice === "scissors" &&
                    computerChoice === "paper")

            ) {

                resultText = "You Win! 🎉";

                playerScore++;

            }

            else {

                resultText = "Computer Wins! 🤖";

                opponentScore++;

            }


            document
                .getElementById("result")
                .innerText =
                "You: " +
                emojis[playerChoice] +
                "  VS  Computer: " +
                emojis[computerChoice] +
                "\n\n" +
                resultText;


            updateScores();

        }


        /* MULTIPLAYER RESULT */

        socket.on("roundResult", (data) => {

            const me = data.players.find(
                player => player.name === playerName
            );

            const opponent = data.players.find(
                player => player.name !== playerName
            );


            if (me && opponent) {

                playerScore = me.score;

                opponentScore = opponent.score;

                updateScores();

            }


            let resultText = "";

            if (data.result === "draw") {

                resultText = "It's a Draw! 🤝";

            }

            else {

                const winner =
                    data.result === "player1"
                    ? data.players[0].name
                    : data.players[1].name;

                resultText =
                    winner + " Wins this round! 🎉";

            }


            document
                .getElementById("result")
                .innerText =
                resultText +
                "\n\nChoose your next move! 🎮";

        });


        /* UPDATE SCORES */

        function updateScores() {

            document
                .getElementById("player-score")
                .innerText = playerScore;

            document
                .getElementById("opponent-score")
                .innerText = opponentScore;

        }


        /* ERRORS */

        socket.on("roomError", (message) => {

            alert(message);

        });


        socket.on("opponentLeft", (message) => {

            alert(message);

            document
                .getElementById("result")
                .innerText = message;

        });


        /* BACK TO MENU */

        function backToMenu() {

            document
                .getElementById("game-section")
                .style.display = "none";

            document
                .getElementById("main-menu")
                .style.display = "block";

            hideAllSections();

            gameMode = "";

            currentRoom = "";

            playerScore = 0;

            opponentScore = 0;

        }

    </script>

</body>

</html>
